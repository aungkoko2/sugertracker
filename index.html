<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ဆီးချို မှတ်တမ်း</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f0f2f5; margin: 0; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; font-size: 22px; }
        
        /* Login UI Styles */
        #loginSection { text-align: center; margin-top: 50px; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.05); display: inline-block; width: 100%; max-width: 300px; }
        .login-input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        
        .input-group { display: flex; gap: 10px; margin-top: 15px; }
        .input-group > div { flex: 1; }
        label { font-weight: bold; color: #34495e; display: block; font-size: 13px; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #dcdde1; box-sizing: border-box; font-size: 15px; }
        
        .btn-main { width: 100%; padding: 12px; background-color: #0984e3; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-main:hover { background-color: #74b9ff; }
        .btn-logout { background-color: #e74c3c; margin-top: 10px; font-size: 14px; padding: 10px; }
        
        .backup-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-export { flex: 1; padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-import { flex: 1; padding: 10px; background-color: #e67e22; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        
        .filter-section { margin-top: 25px; padding: 15px; background-color: #e8f4f8; border-radius: 8px; border: 1px solid #d1e8ee; }
        .filter-section label { color: #0984e3; font-size: 14px; }
        
        .summary-title { font-size: 14px; font-weight: bold; color: #2d3436; margin-top: 20px; border-left: 4px solid; padding-left: 8px; }
        .title-morning { border-color: #0984e3; }
        .title-night { border-color: #e84118; }
        .summary { display: flex; justify-content: space-between; margin-top: 10px; text-align: center; gap: 10px; }
        .box { flex: 1; padding: 10px; border-radius: 8px; color: white; font-size: 13px; }
        .high { background-color: #d63031; }
        .normal { background-color: #00b894; }
        .low { background-color: #fdcb6e; color: #2d3436; }
        .count-num { font-size: 20px; font-weight: bold; display: block; margin-top: 5px; }

        .section-title { font-size: 16px; color: #2d3436; margin: 25px 0 10px 0; font-weight: bold; border-left: 4px solid #0984e3; padding-left: 8px; }
        .chart-container { background: #fff; border: 1px solid #dfe6e9; border-radius: 8px; padding: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
        th, td { padding: 12px 5px; border-bottom: 1px solid #dfe6e9; text-align: center; }
        th { background-color: #f5f6fa; color: #2f3640; font-weight: bold; font-size: 14px; }
        .td-high { color: #d63031; font-weight: bold; }
        .td-low { color: #e17055; font-weight: bold; }
        .td-normal { color: #00b894; font-weight: bold; }
        .td-none { color: #b2bec3; font-size: 13px; }
        
        .actions { margin-top: 8px; display: flex; justify-content: center; gap: 10px; }
        .icon-btn { cursor: pointer; font-size: 14px; transition: transform 0.2s; user-select: none; }
        .icon-btn:hover { transform: scale(1.3); }
        
        #syncStatus { text-align: center; font-size: 12px; color: #27ae60; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<!-- Login Section -->
<div id="loginSection">
    <h2>🔒 အကောင့်ဝင်ရန်</h2>
    <div class="login-box">
        <input type="email" id="loginEmail" class="login-input" placeholder="အီးမေးလ် ထည့်ပါ">
        <input type="password" id="loginPassword" class="login-input" placeholder="စကားဝှက် ထည့်ပါ">
        <button class="btn-main" onclick="login()">ဝင်မည်</button>
    </div>
</div>

<!-- Main App Section (အစတွင် ဖျောက်ထားပါမည်) -->
<div id="appSection" class="container" style="display: none;">
    <h2>ဆီးချိုမှတ်တမ်း 📝</h2>
    <div id="syncStatus">🟢 Cloud ဖြင့် ချိတ်ဆက်ထားပါသည်</div>
    
    <div class="input-group">
        <div>
            <label>ရက်စွဲ</label>
            <input type="date" id="dateInput">
        </div>
        <div>
            <label>အချိန်</label>
            <select id="timeInput">
                <option value="morning">🌅 မနက်ပိုင်း</option>
                <option value="night">🌙 ညပိုင်း</option>
            </select>
        </div>
    </div>
    
    <div style="margin-top: 10px;">
        <label>ဆီးချို ပမာဏ (mg/dL)</label>
        <input type="number" id="sugarInput" placeholder="ပမာဏ ရိုက်ထည့်ပါ (ဥပမာ - 120)">
    </div>
    
    <button class="btn-main" onclick="saveRecord()">မှတ်သားမည်</button>

    <div class="backup-group">
        <button class="btn-export" onclick="exportData()">💾 ဒေတာ သိမ်းမည်</button>
        <button class="btn-import" onclick="document.getElementById('importFile').click()">📂 ဖိုင်မှ ပြန်ထည့်မည်</button>
        <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
    </div>

    <div class="filter-section">
        <label>📅 လအလိုက် ကြည့်ရန်:</label>
        <select id="monthFilter" onchange="applyFilter()">
            <option value="all">လအားလုံး ပြမည်</option>
        </select>
    </div>

    <div class="summary-title title-morning">🌅 မနက်ပိုင်း အခြေအနေ</div>
    <div class="summary">
        <div class="box high">တက်<span class="count-num" id="mHigh">0</span></div>
        <div class="box normal">ပုံမှန်<span class="count-num" id="mNormal">0</span></div>
        <div class="box low">ကျ<span class="count-num" id="mLow">0</span></div>
    </div>

    <div class="summary-title title-night">🌙 ညပိုင်း အခြေအနေ</div>
    <div class="summary">
        <div class="box high">တက်<span class="count-num" id="nHigh">0</span></div>
        <div class="box normal">ပုံမှန်<span class="count-num" id="nNormal">0</span></div>
        <div class="box low">ကျ<span class="count-num" id="nLow">0</span></div>
    </div>

    <div class="section-title">📊 အတက်အကျ အခြေအနေ</div>
    <div class="chart-container">
        <canvas id="sugarChart"></canvas>
    </div>

    <div class="section-title">📅 နေ့စဉ် ဇယား</div>
    <table>
        <thead>
            <tr>
                <th>ရက်စွဲ</th>
                <th>🌅 မနက်</th>
                <th>🌙 ည</th>
            </tr>
        </thead>
        <tbody id="historyLog">
            <!-- မှတ်တမ်းများ ဒီနေရာတွင် ပေါ်လာပါမည် -->
        </tbody>
    </table>
    
    <!-- Logout Button -->
    <button class="btn-main btn-logout" onclick="logout()">🚪 အကောင့်မှ ထွက်မည်</button>
</div>

<!-- Firebase Module Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDuuF-9P_zv_At-2ix_ZKLHmksHSy_hod4",
      authDomain: "sugertracker.firebaseapp.com",
      projectId: "sugertracker",
      storageBucket: "sugertracker.firebasestorage.app",
      messagingSenderId: "1085063211290",
      appId: "1:1085063211290:web:94b4746cbcfcdf849724a3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const recordsRef = ref(db, 'sugarRecords');

    document.getElementById('dateInput').valueAsDate = new Date();
    let myChart = null; 
    let currentRecords = []; 

    // --- Authentication (Login/Logout Check) ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // လော့အင် ဝင်ထားလျှင် App ကိုပြပါ
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            fetchData(); // ဒေတာများ ဆွဲယူပါ
        } else {
            // လော့အင် မဝင်ထားလျှင် Login ကိုသာ ပြပါ
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('appSection').style.display = 'none';
        }
    });

    window.login = function() {
        let email = document.getElementById('loginEmail').value;
        let password = document.getElementById('loginPassword').value;
        signInWithEmailAndPassword(auth, email, password)
            .then(() => { alert("အကောင့်ဝင်ခြင်း အောင်မြင်ပါသည်။"); })
            .catch((error) => { alert("အီးမေးလ် သို့မဟုတ် စကားဝှက် မှားယွင်းနေပါသည်။"); });
    };

    window.logout = function() {
        signOut(auth).then(() => { alert("အကောင့်မှ ထွက်ပြီးပါပြီ။"); });
    };

    // --- Fetch Data ---
    function fetchData() {
        onValue(recordsRef, (snapshot) => {
            currentRecords = [];
            snapshot.forEach((childSnapshot) => {
                currentRecords.push(childSnapshot.val());
            });
            updateFilterDropdown(); 
            applyFilter(); 
        });
    }

    function updateFilterDropdown() {
        let filterSelect = document.getElementById('monthFilter');
        let currentSelected = filterSelect.value;
        
        let monthsSet = new Set();
        currentRecords.forEach(r => {
            if(r.date) monthsSet.add(r.date.substring(0, 7)); 
        });
        
        let sortedMonths = Array.from(monthsSet).sort().reverse(); 
        let html = `<option value="all">လအားလုံး ပြမည်</option>`;
        sortedMonths.forEach(m => {
            let dateObj = new Date(m + '-01');
            let displayString = dateObj.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }); 
            html += `<option value="${m}">${displayString}</option>`;
        });
        filterSelect.innerHTML = html;
        if (sortedMonths.includes(currentSelected) || currentSelected === 'all') filterSelect.value = currentSelected;
    }

    window.applyFilter = function() {
        let selectedMonth = document.getElementById('monthFilter').value;
        if (selectedMonth === 'all') renderUI(currentRecords);
        else {
            let filteredRecords = currentRecords.filter(r => r.date && r.date.startsWith(selectedMonth));
            renderUI(filteredRecords);
        }
    };
    
    function checkStatus(level, time) {
        if (!level) return { text: '-', class: 'td-none' };
        let highLimit = (time === 'morning') ? 130 : 180;
        if (level < 70) return { text: level, class: 'td-low' };
        if (level > highLimit) return { text: level, class: 'td-high' };
        return { text: level, class: 'td-normal' };
    }

    function renderUI(records) {
        let mHigh = 0, mNormal = 0, mLow = 0;
        let nHigh = 0, nNormal = 0, nLow = 0;
        let groupedData = {};

        records.forEach(record => {
            if (record.time === 'morning') {
                if (record.level < 70) mLow++; else if (record.level > 130) mHigh++; else mNormal++;
            } else {
                if (record.level < 70) nLow++; else if (record.level > 180) nHigh++; else nNormal++;
            }
            if (!groupedData[record.date]) groupedData[record.date] = { morning: null, night: null };
            groupedData[record.date][record.time] = record.level; 
        });

        document.getElementById('mHigh').innerText = mHigh;
        document.getElementById('mNormal').innerText = mNormal;
        document.getElementById('mLow').innerText = mLow;
        document.getElementById('nHigh').innerText = nHigh;
        document.getElementById('nNormal').innerText = nNormal;
        document.getElementById('nLow').innerText = nLow;

        let sortedDates = Object.keys(groupedData).sort((a, b) => new Date(b) - new Date(a));
        let historyHTML = '';
        
        sortedDates.forEach(date => {
            let dayData = groupedData[date];
            let mData = checkStatus(dayData.morning, 'morning');
            let nData = checkStatus(dayData.night, 'night');
            let d = new Date(date);
            let dateString = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

            let mActions = dayData.morning ? `<div class="actions"><span class="icon-btn" title="ပြင်မည်" onclick="editRecord('${date}', 'morning', ${dayData.morning})">✏️</span> <span class="icon-btn" title="ဖျက်မည်" onclick="deleteRecord('${date}', 'morning')">🗑️</span></div>` : '';
            let nActions = dayData.night ? `<div class="actions"><span class="icon-btn" title="ပြင်မည်" onclick="editRecord('${date}', 'night', ${dayData.night})">✏️</span> <span class="icon-btn" title="ဖျက်မည်" onclick="deleteRecord('${date}', 'night')">🗑️</span></div>` : '';

            historyHTML += `
            <tr>
                <td><strong>${dateString}</strong></td>
                <td class="${mData.class}">${mData.text} ${mActions}</td>
                <td class="${nData.class}">${nData.text} ${nActions}</td>
            </tr>`;
        });
        document.getElementById('historyLog').innerHTML = historyHTML;

        let chartDates = [...sortedDates].reverse(); 
        let labels = [];
        let morningData = [];
        let nightData = [];

        chartDates.forEach(date => {
            let d = new Date(date);
            labels.push(d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }));
            morningData.push(groupedData[date].morning);
            nightData.push(groupedData[date].night);
        });

        if (myChart) myChart.destroy(); 
        let ctx = document.getElementById('sugarChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'မနက် (🌅)', data: morningData, borderColor: '#0984e3', backgroundColor: '#0984e3', tension: 0.3, spanGaps: true },
                    { label: 'ည (🌙)', data: nightData, borderColor: '#e84118', backgroundColor: '#e84118', tension: 0.3, spanGaps: true }
                ]
            },
            options: { responsive: true, scales: { y: { suggestedMin: 80, suggestedMax: 200 } } }
        });
    }

    // --- Data Operations ---
    window.saveRecord = function() {
        let date = document.getElementById('dateInput').value;
        let time = document.getElementById('timeInput').value;
        let level = document.getElementById('sugarInput').value;

        if (!level) return alert('ကျေးဇူးပြု၍ ဆီးချိုပမာဏကို ထည့်ပါ။');
        let recordId = date + '_' + time;
        set(ref(db, 'sugarRecords/' + recordId), { date: date, time: time, level: parseInt(level) })
        .then(() => document.getElementById('sugarInput').value = '');
    };

    window.editRecord = function(date, time, oldLevel) {
        let timeLabel = time === 'morning' ? "မနက်ပိုင်း" : "ညပိုင်း";
        let newValue = prompt(`📅 ${date} (${timeLabel})\nဆီးချိုပမာဏ အသစ်ကို ရိုက်ထည့်ပါ:`, oldLevel);
        if (newValue !== null && newValue.trim() !== "") {
            let parsedValue = parseInt(newValue);
            if (!isNaN(parsedValue)) {
                set(ref(db, 'sugarRecords/' + date + '_' + time), { date: date, time: time, level: parsedValue });
            } else alert("ကျေးဇူးပြု၍ ဂဏန်းသာ ရိုက်ထည့်ပါ။");
        }
    }

    window.deleteRecord = function(date, time) {
        let timeLabel = time === 'morning' ? "မနက်ပိုင်း" : "ညပိုင်း";
        if (confirm(`📅 ${date} (${timeLabel}) မှတ်တမ်းကို ဖျက်ရန် သေချာပါသလား?`)) {
            remove(ref(db, 'sugarRecords/' + date + '_' + time));
        }
    }

    window.exportData = function() {
        if (currentRecords.length === 0) return alert('သိမ်းဆည်းရန် မှတ်တမ်း မရှိသေးပါ။');
        let blob = new Blob([JSON.stringify(currentRecords)], { type: 'application/json' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url; a.download = 'sugar_backup.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    window.importData = function(event) {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    importedData.forEach(record => {
                        if(record.date && record.time && record.level) {
                            set(ref(db, 'sugarRecords/' + record.date + '_' + record.time), {
                                date: record.date, time: record.time, level: parseInt(record.level)
                            });
                        }
                    });
                    alert('ဒေတာများကို အောင်မြင်စွာ ပြန်လည်ထည့်သွင်းပြီးပါပြီ။');
                } else alert('ဖိုင်အမျိုးအစား မှားယွင်းနေပါသည်။');
            } catch (error) { alert('ဖိုင်ဖတ်ရာတွင် အမှားအယွင်းရှိပါသည်။'); }
        };
        reader.readAsText(file);
        event.target.value = ''; 
    }
</script>

</body>
</html>
